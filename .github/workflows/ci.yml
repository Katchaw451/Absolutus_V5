name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + ruff
        run: |
          pip install -e .
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          absolutus --version
          absolutus parse
          absolutus detect top
          absolutus detect correlation
