[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "absolutus-v5"
version = "4.0.0"
description = "Multi-source security log pipeline (SSH auth + nginx) with SQL detection rules."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
absolutus = "absolutus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
